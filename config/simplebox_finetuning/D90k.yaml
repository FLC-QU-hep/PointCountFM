name: pcfm_simplebox_finetuning_D90k
result_path: results/simplebox_finetuning/D90k

data:
  data_file: data/simplebox_finetune_100k.h5
  batch_size: 1024
  batch_size_val: 4096
  val_samples: 5000
  max_samples: null
  use_nlayers_conditioning: true
  use_direction_conditioning: true
  transform_num_points:
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 45]}]
  transform_fsamp:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]
  transform_nlayers:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]

model:
  name: FullyConnected
  dim_input: 45
  dim_condition: 6
  dim_time: 6
  hidden_dims: [128, 256, 512, 256, 128]
  dropout: 0.1

training:
  pretrain_weights: results/pretrain_SimpleBox/best_model.pt
  use_pretrain_transforms: true
  reset_output_layer: false
  epochs: 3000
  patience: 300
  physics_patience: 15
  test_every: 20
  optimizer:
    name: AdamW
    lr: 1.0e-8
    weight_decay: 0
