name: pcfm_allegro_finetuning_from_simplebox_D10k
result_path: results/allegro_finetuning/from_simplebox/D10k

data:
  data_file: data/allegro_100k_pcfm.h5
  batch_size: 64
  batch_size_val: 1024
  train_fraction: 0.95
  val_samples: 5000
  max_samples: 10000
  use_nlayers_conditioning: true
  use_direction_conditioning: true
  transform_num_points:
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 45]}]
  transform_fsamp:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]
  transform_nlayers:
    - [MinMaxScaler, {shape: [1, 1], target_min: -1.0, target_max: 1.0}]

model:
  name: FullyConnected
  dim_input: 45
  dim_condition: 6
  dim_time: 6
  hidden_dims: [128, 256, 512, 256, 128]
  dropout: 0.1

training:
  pretrain_weights: results/pretrain_SimpleBox/best_model.pt
  # Reset ALL output rows: breaks the L10 trap (validated at 100k, 5.30% corrected).
  reset_output_layer: true
  # No layer freezing: frozen encoder (SimpleBox 45-dim) cannot adapt to ALLEGRO geometry.
  # Regularization via dropout=0.1 only (same strategy as 100k finetune → 5.30%).
  epochs: 3000
  patience: 3000
  physics_patience: 50
  test_every: 20
  optimizer:
    name: AdamW
    lr: 1.0e-4
    weight_decay: 5.0e-4
  scheduler:
    name: CosineAnnealingLR
    T_max: 3000
    eta_min: 1.0e-6
