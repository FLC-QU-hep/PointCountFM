name: Python test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install torch==2.6.* --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test with Unittest
        # Tests live in tests/ as test_*.py. The old '-s test -p *_test.py'
        # matched nothing (it resolved to the stdlib 'test' package) and passed
        # vacuously. The data-driven audit tests skip themselves when the
        # on-disk results are absent (as in CI), so this stays green.
        run: python -m unittest discover --verbose -s tests -p 'test_*.py'
        env:
          PYTHONPATH: src/
